<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A9E"/>
      <stop offset="50%" stop-color="#FECFEF"/>
      <stop offset="100%" stop-color="#FFECD2"/>
    </linearGradient>
    <linearGradient id="smoothieLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#FFA07A"/>
      <stop offset="100%" stop-color="#FFD97D"/>
    </linearGradient>
    <linearGradient id="strawGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Decorative Glow -->
  <circle cx="200" cy="280" r="140" fill="#FF9A9E" opacity="0.25" filter="url(#glow)"/>

  <!-- Straw -->
  <path d="M 230 40 L 210 140 L 195 440" stroke="url(#strawGrad)" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- Cup Glass Back/Liquid Base -->
  <path d="M 100 140 L 300 140 L 270 430 Q 270 450 200 450 Q 130 450 130 430 Z" fill="url(#smoothieLiquid)"/>

  <!-- Fruit Pieces floating in liquid -->
  <circle cx="160" cy="220" r="18" fill="#FF5252" opacity="0.8"/>
  <circle cx="230" cy="260" r="24" fill="#FFD700" opacity="0.85"/>
  <circle cx="175" cy="330" r="20" fill="#FF4081" opacity="0.8"/>
  <circle cx="240" cy="370" r="15" fill="#4CAF50" opacity="0.75"/>

  <!-- Smoothie Top Whipped Cream / Foam layer -->
  <path d="M 95 145 Q 120 120 150 140 Q 180 110 210 135 Q 240 115 270 140 Q 305 125 305 145 Z" fill="#FFFFFF" opacity="0.95"/>

  <!-- Glass Cup Highlight Overlay -->
  <path d="M 100 140 L 300 140 L 270 430 Q 270 450 200 450 Q 130 450 130 430 Z" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.6"/>
  <path d="M 125 160 L 140 410" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

  <!-- Mint Leaf Garnishing -->
  <path d="M 240 120 Q 270 90 285 110 Q 260 135 240 120 Z" fill="#00C853"/>
  <path d="M 240 120 Q 220 90 200 105 Q 225 130 240 120 Z" fill="#69F0AE"/>

  <!-- Mango slice garnish -->
  <path d="M 130 130 Q 110 90 140 80 Q 160 110 130 130 Z" fill="#FFAB00"/>
</svg>
