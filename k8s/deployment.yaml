apiVersion: apps/v1
kind: Deployment
metadata:
  name: fresh-smoothie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fresh-smoothie
  template:
    metadata:
      labels:
        app: fresh-smoothie
    spec:
      containers:
        - name: fresh-smoothie
          image: IMAGE_URI
          ports:
            - containerPort: 80
